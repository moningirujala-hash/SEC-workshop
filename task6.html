<!DOCTYPE html>
<html>
    <head>
     <title>Registration Form</title>
    </head>
    <body>
     <h1>Registration Form</h1>
     <form>
    <lable for="">First name:</label>
    <input type="text" placeholder="enter your first name"><br>
    <lable for="">Last name:</label>
    <input type="text" placeholder="enter your last name"><br>
    <lable for="">Email:</label>
    <input type="email" placeholder="enter your email"><br>
    <lable for="">Password:</label>
    <input type="password"><br>
    <lable for="">Gender:</label><br>
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male"><br>
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female"><br>
    <label for="other">Other</label>
    <input type="radio" id="other" name="gender" value="other"><br>
    <lable for="">Age:</label>
    <input type="number" placeholder="enter your age"><br>
    <lable for="">preferences:</label><br>
    <lable for="">acrylic painting</lable>
    <input type="checkbox" name="preferences" value="acrylic painting"><br>
    <lable for="">watercolor painting</lable>
    <input type="checkbox" name="preferences" value="watercolor painting"><br>
    <lable for="">oil painting</lable>
    <input type="checkbox" name="preferences" value="oil painting"><br>
    <lable for="">select occupation</lable>
    <input type="text" placeholder="student"><br>
    <lable for="">Bio:</lable>
    <textarea name="bio" rows="4" cols="50" placeholder="write about yourself"></textarea><br>
    <input type="reset">
    <input type="submit"> </form>

    </body>
